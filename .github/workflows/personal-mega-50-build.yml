name: Personal Mega Madness 50pct ROM

on:
  push:
    branches:
      - personal/mega-madness-50pct-encounters
    paths:
      - src/randomizer.c
      - .github/workflows/personal-mega-50-build.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-personal-rom:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this personal branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Build Heart and Soul
        run: make hns -j2

      - name: Name personal GBA
        run: cp pokehns.gba MegaMadness_50Percent_Personal.gba

      - name: Upload personal ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegaMadness_50Percent_Personal
          path: MegaMadness_50Percent_Personal.gba
          if-no-files-found: error

      - name: Commit ROM only to personal branch for direct download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f MegaMadness_50Percent_Personal.gba
          if ! git diff --cached --quiet; then
            git commit -m "Personal 50 percent encounter GBA [skip ci]"
            git push origin HEAD:personal/mega-madness-50pct-encounters
          fi
